name: Build Backend

on:
  push:
    paths: [backend-rust/**, scripts/**, macos/**, deployment/**, install.sh, start.sh, .github/workflows/backend.yml]
  pull_request:
    paths: [backend-rust/**, scripts/**, macos/**, deployment/**, install.sh, start.sh, .github/workflows/backend.yml]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: agentshell-backend-linux-x86_64
            asset: agentshell-backend
          - runner: macos-15
            artifact: agentshell-backend-macos-arm64
            asset: agentshell-backend-macos-arm64
            browser_asset: AgentShellBrowser-macos-arm64.app.zip
          - runner: macos-15-intel
            artifact: agentshell-backend-macos-x86_64
            asset: agentshell-backend-macos-x86_64
            browser_asset: AgentShellBrowser-macos-x86_64.app.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev tmux python3-venv

      - name: macOS prerequisites
        if: runner.os == 'macOS'
        run: brew install tmux pkg-config openssl@3

      - name: Native Chrome helper build and permission checks
        if: runner.os == 'macOS'
        run: |
          if [[ -f scripts/build-macos-browser.sh ]]; then
            bash scripts/build-macos-browser.sh --output "$RUNNER_TEMP/AgentShellBrowser.app"
            "$RUNNER_TEMP/AgentShellBrowser.app/Contents/MacOS/AgentShellBrowser" --self-test
            "$RUNNER_TEMP/AgentShellBrowser.app/Contents/MacOS/AgentShellBrowser" --check > "$RUNNER_TEMP/browser-permissions.json" || true
            python3 -c 'import json,sys; assert isinstance(json.load(open(sys.argv[1])),dict)' "$RUNNER_TEMP/browser-permissions.json"
            ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/AgentShellBrowser.app" "$RUNNER_TEMP/${{ matrix.browser_asset }}"
          else
            echo "Native Chrome helper source has not been included in this core checkpoint."
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rust

      - name: Build
        run: cargo build --release --locked
        working-directory: backend-rust

      - name: Rust regressions
        run: cargo test --locked -- --test-threads=1
        working-directory: backend-rust

      - name: Installer and identity regressions
        run: |
          python3 scripts/test_backend_install.py
          python3 scripts/test_chat_binding_hooks.py
          python3 scripts/test_process_identity.py
          python3 scripts/test_macos_install.py

      - name: Native daemon smoke
        run: |
          python3 -m venv .ci-python
          .ci-python/bin/python -m pip install 'websockets>=13,<16'
          .ci-python/bin/python scripts/test_native_backend_smoke.py --binary backend-rust/target/release/agentshell-backend --output "$RUNNER_TEMP/native-smoke"
          .ci-python/bin/python scripts/test_native_chat_platform.py --binary backend-rust/target/release/agentshell-backend --output "$RUNNER_TEMP/native-chat"

      - name: Stage platform release asset
        run: |
          mkdir -p dist
          cp backend-rust/target/release/agentshell-backend dist/${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.asset }}

      - name: Upload native browser helper
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-browser-helper
          path: ${{ runner.temp }}/${{ matrix.browser_asset }}
          if-no-files-found: ignore

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: agentshell-backend-*
          path: artifacts

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/agentshell-backend*
            artifacts/**/AgentShellBrowser-*.app.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
