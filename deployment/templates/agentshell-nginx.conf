# Serve through trusted HTTPS (an encrypted tunnel, or a TLS origin listener).
# Render SERVER_NAME and UPSTREAM before installing in nginx's http context.
map $http_upgrade $agentshell_homelab_connection {
    default upgrade;
    '' close;
}

server {
    # Keep the tunnel endpoint separate from existing public virtual hosts.
    listen 127.0.0.1:18080;
    server_name {{SERVER_NAME}};
    client_max_body_size 20m;

    location / {
        proxy_pass {{UPSTREAM}};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $agentshell_homelab_connection;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
